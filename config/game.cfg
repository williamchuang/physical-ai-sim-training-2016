# Physical AI Simulation Training (2016) -- settings
# Paths are relative to the project folder. Other presets live in config/presets/.

mode = demo                # demo: the trained bot collects coins on its own
                           # compare: demo plus a cube you drive, scores side by side
                           # train: you (or the autopilot) drive while the network learns
demonstrator = keyboard    # train mode: keyboard (you) or autopilot (scripted expert)
camera_view = chase        # chase: behind the followed cube | agent: through the bot's camera
mirror = true              # rear-view inset
collisions = true

neural_agents = 1          # bots driven by the policy network (demo, compare)
scripted_agents = 0        # lane-keeping obstacle cubes at a constant speed
coins = 74
respawn_coins = false      # false: a collected coin is gone

round_seconds = 90

# Perception and policy: sensor_width x sensor_height grey pixels -> hidden units -> 4 actions
# (the 2016 builds: 3 x 3 -> 6; the shipped policy: 20 x 20 -> 32)
sensor_width = 20
sensor_height = 20
hidden_units = 32
decision_interval = 0.1    # seconds between decisions

# Training (mode = train)
learning_rate = 0.05
batch_size = 5
replay_capacity = 2048
autosave_seconds = 15
policy_file = models/policy.txt

seed = 2016
