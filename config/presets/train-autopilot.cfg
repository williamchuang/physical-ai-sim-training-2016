# Train from the autopilot: a scripted expert presses the driving keys while
# the network learns from the cube's camera. Used for the shipped policy.
mode = train
demonstrator = autopilot
scripted_agents = 16
respawn_coins = true
round_seconds = 1500
autosave_seconds = 30
dagger_share = 0.5          # the network drives half the time; the autopilot labels every decision
decision_interval = 0.05
learning_rate = 0.1
batch_size = 32
replay_capacity = 20000
