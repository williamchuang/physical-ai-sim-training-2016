# Records training data for transformer/training/train.py: the autopilot drives your
# cube and labels every camera frame; with dagger_share the network drives part
# of the time (DAgger). Runs about 9 times faster than real time with a fixed step.
#   ./build/pai_sim transformer/config/record.cfg   (close the window to stop)
mode = train
demonstrator = autopilot
scripted_agents = 16
respawn_coins = true
round_seconds = 100000
decision_interval = 0.05
dagger_share = 0.3
learning_rate = 0               # recording only: leave the MLP's weights as they are
record_file = transformer/recordings/run.bin
fixed_frame_seconds = 0.0333333
startup_script = scripts/evaluate.lua
# For a DAgger round with the transformer at the wheel, add:
# policy_kind = transformer
