name: checks

on: [push, pull_request]

jobs:
  readme-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository tree in README.md is current
        run: python3 tools/update_readme_tree.py --check

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation core and its tests (no engine needed)
        run: |
          cmake -S . -B build -DPAI_BUILD_GAME=OFF
          cmake --build build -j 2
      - name: Run the tests
        run: ./build/pai_tests
